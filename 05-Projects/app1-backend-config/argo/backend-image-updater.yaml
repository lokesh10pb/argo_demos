apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: backend-image-updater
  namespace: argocd

spec:
  writeBackConfig:
    method: argocd

  applicationRefs:
    - namePattern: app1-be-app
      images:
        - alias: backend
          imageName: lucky730/app1-backend:v1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
            platforms:
              - linux/arm64
              - linux/amd64