apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1-be-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lokesh10pb/ArgoCD-Basics-To-Production.git
    targetRevision: main
    path: 05-Projects/app1-backend-config/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: app1-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
